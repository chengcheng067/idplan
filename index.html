<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- 浏览器 UI 配色跟随系统深/浅偏好（双主题） -->
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)" />
    <!--
      首屏防闪（主题）：在样式与脚本执行前同步写好 <html data-theme>。
      优先级：用户显式选择（localStorage 'idplan-theme'）> 系统 prefers-color-scheme。
      必须与 src/hooks/useTheme.ts 的 STORAGE_KEY 保持一致。
    -->
    <script>
      (function () {
        try {
          var v = localStorage.getItem('idplan-theme');
          var t =
            v === 'dark' || v === 'light'
              ? v
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <!--
      首屏防闪（界面语言 · 2026-10-13 中英切换）：与主题脚本同款做法，在样式与脚本
      执行前同步写好 <html lang> 与 <html data-lang>。

      与主题的差别（别照着主题的样子理解这一段）：主题防的是「先画错肤色」；
      语言其实**不存在首帧闪中文**——src/i18n/lang.ts 的语言状态是模块级同步求值，
      React 第一次渲染时就已经是持久化的语言。本脚本的真实职责有两条：
        ① `<html lang>` 影响无障碍朗读与浏览器翻译提示，越早写越好；
        ② `<html data-lang>` 是 CSS 侧的唯一钩子（`[data-lang="en"]` 下的行长/断词
           规则），必须早于样式生效，否则英文会长一帧中文的排版。

      口径（必须与 src/i18n/lang.ts 严格一致）：
        · localStorage key = 'idplan-lang'，合法值只有 'zh' / 'en'；
        · `data-lang` 写内部值（zh/en），`lang` 写 HTML 语义值（zh-CN / en）；
        · 读不到 / 脏值 / 抛异常 → 一律回落 'zh'（**出厂默认恒为中文**，
          不跟随浏览器 Accept-Language，理由见 lang.ts 文件头）。
    -->
    <script>
      (function () {
        var lang = 'zh';
        try {
          var v = localStorage.getItem('idplan-lang');
          if (v === 'en' || v === 'zh') lang = v;
        } catch (e) {
          /* 存储不可用：保持出厂默认 'zh' */
        }
        document.documentElement.lang = lang === 'en' ? 'en' : 'zh-CN';
        document.documentElement.dataset.lang = lang;
      })();
    </script>
    <!--
      首屏防闪（侧栏折叠态 · v0.7 R13）：与主题脚本同款做法，在样式生效前同步写好
      <html data-sidebar-collapsed>，使侧栏宽度**首帧即正确**——否则会出现
      「先按默认宽度画一帧，React 水合后再跳到持久值」的宽度跳变（布局抖动）。

      口径（必须与 src/store/useLayoutStore.ts 严格一致）：
        · localStorage key = 'idplan.layout'（zustand persist 的 name）
        · persist 包裹后 JSON 形如 {"state":{"sidebarExpanded":true},"version":0}
        · 读到合法 sidebarExpanded → 取反写 data-sidebar-collapsed
        · 读不到 / 解析失败 / 键缺失 → 回落 matchMedia('(min-width: 1280px)')
          （与 defaultExpanded() 同一口径：≥1280 展开、以下收起）

      容错：任何异常都静默回落到 CSS 默认（展开），绝不抛错阻塞首屏。
      注意：此脚本只负责「DOM 属性先行」；内存状态的唯一真相源仍是
      useLayoutStore，main.tsx 会调 initSidebarCollapsed() 做一次对齐纠正
      （防 localStorage 内容损坏时 DOM 与内存打架）。
    -->
    <script>
      (function () {
        function fallback() {
          try {
            return !!(window.matchMedia && window.matchMedia('(min-width: 1280px)').matches);
          } catch (e) {
            return true;
          }
        }
        var expanded = fallback();
        try {
          var raw = localStorage.getItem('idplan.layout');
          if (raw) {
            var parsed = JSON.parse(raw);
            var val = parsed && parsed.state && parsed.state.sidebarExpanded;
            if (typeof val === 'boolean') expanded = val;
          }
        } catch (e) {
          /* 内容损坏：保持 fallback 结果 */
        }
        document.documentElement.dataset.sidebarCollapsed = expanded ? 'false' : 'true';
      })();
    </script>
    <!-- 全平台新 logo：蓝 P 白色圆角方块。favicon 复用 public/logo.png（Vite 会把 /logo.png 拷到 dist 根） -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta
      name="description"
      content="ID Plan — 跨行业项目排程工具：把合同变成一张看得懂的阶段时间轴：把合同变成一张看得懂的阶段时间轴。"
    />
    <!--
      标题**不写死版本号**（2026-10-14 修）：原来是 `ID Plan · v0.8 Beta`，而本版出货号
      已经是 1.0.0.0009 —— 一个只有发布时才会被记起来改的字符串，必然过期。
      版本号的真值出处是 `version.json` / `package.json` / 构建期 `BUILD_VERSION`
      （设置 ▸ 关于 里显示那个），这里不再复述第二份。
      「内测」这件事由设置抽屉标题上的 Beta 徽标（`settings.betaBadge`）承担，与标题无关。
      ⚠️ 刻意**不**为它加 Vite 插件（项目原则：尽量不加依赖）——静态常量最省。
    -->
    <title>ID Plan</title>
    <!-- 运行时配置注入点（Docker / 绿联容器端在启动时覆盖，实现不重建镜像切换数据源）：
         1) 先给构建期占位（local），保证非容器环境（本地开发 / Electron 桌面版）可直接运行；
         2) 再【同步】加载 /env-config.js 覆盖它——顺序必须在占位之后，否则注入值会被占位反向覆盖；
            用同步 script（非 module/非 defer）确保在 main.tsx 读取 appEnv 之前执行完毕。
            该文件由容器 entrypoint.sh 用环境变量渲染；非容器环境无此文件时静默 404，
            由 onerror 吞掉错误，不影响任何既有行为。 -->
    <script>
      window.__APP_ENV__ = { VITE_DATA_SOURCE: 'local', VITE_API_BASE_URL: '' };
    </script>
    <!-- 绿联 Docker 应用是 IP:端口直连（根路径），env-config.js 固定位于站点根，用绝对 /env-config.js。
         base 默认 '/' 时 %BASE_URL% 即为 '/'，这里写 /env-config.js 即可。 -->
    <script src="/env-config.js" onerror="/* 非容器环境无此文件，忽略即可 */"></script>
  </head>
  <body>
    <!-- 宋体系衬线标题字体为本地字体栈优先（离线优先原则，不强拉网络字体）；
         如需更佳视觉可在部署环境自行放置 Noto Serif SC 并在 global.css 中扩充 -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
