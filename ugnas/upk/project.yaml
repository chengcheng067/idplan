# =====================================================================
# ID Plan · UGOS Pro 应用配置（ugcli pack 使用）
# 使用方式：
#   1. 在 ugnas/ 下执行 `ugcli create com.chengcheng.idplan` 生成项目骨架，
#      或用本文件作为参考手写 project.yaml；
#   2. 将 dist/ 构建产物与 nginx/、scripts/ 依 Dockerfile 方式打入镜像
#      并导出为 tar，放到 rootfs_<arch>/images/；
#   3. 本 project.yaml 放项目根目录，`ugcli pack --build 1` 生成 upk。
# 注意：version 为 x.y.z，构建号通过 --build 追加 → 最终 x.y.z.b。
# =====================================================================
spec_version: "2.1"
app_id: com.chengcheng.idplan
version: 0.8.6
support_arch:
  - amd64
  - arm64

# 客户端类型：pc=桌面端，app=移动端（Docker 应用 tab 直连 IP:端口，手机浏览器亦可访问；适配手机见前端响应式）
supports:
  - pc
  - app

# Docker 应用开关（绿联 Docker 应用开发方式）——便于后期改用原生应用时切换
is_docker_app: true
# 仅 Docker 应用：依赖的 Docker 套件最低版本（按绿联文档，需与 NAS 实际一致）
depend_docker_version: 1.7.0.0000
# 最低固件版本（声明白依赖时必填；版本号请联系绿联开发确认）
depend_fw_version: 1.13.0.0000

# 对外监听端口：宿主端口（Docker 应用 IP:端口直连访问模型，与 compose 的 28080:80 对应）。
# 官方 Docker 应用示例 port: 29090 与 compose ports: "29090:9090" 同值 → port=宿主端口。
port: 28080
# 打开方式：tab = 在浏览器新标签页直接通过 IP+端口访问应用。
# Docker 应用（nginx 托管完整 SPA）是「IP:端口直连」模型，不走系统网关，
# 故用 tab；proxy_path 是原生应用专用字段（把 /api 前缀转给后端进程），Docker 应用无需配置。
open_type: tab

# 应用类别
tag_types:
  - utility
  - devtool

# 应用自定义配置（安装/应用中心可改）：与 docker-compose 的 ${VAR} 对应
parameters:
  - key: VITE_DATA_SOURCE
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: Data Source
        description: local = browser IndexedDB (offline); remote = NAS backend API
      zh-CN:
        name: 数据源
        description: local = 浏览器本地存储（离线）；remote = NAS 后端 API（多端同步）
  - key: VITE_API_BASE_URL
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: API Base URL
        description: Required when data source is remote. Keep "/api" — nginx proxies it to the backend container (no NAS IP needed).
      zh-CN:
        name: 后端 API 地址
        description: 仅 remote 数据源必填。保持 "/api" 即可——nginx 已反代到后端容器，无需填 NAS IP。
  - key: IDPLAN_AGENT_TOKEN
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: Backup Token
        description: Shared secret for in-app backup/restore. Set any random string here, then enter the SAME string in ID Plan Settings -> NAS Service. Leave empty = in-app backup refused (fail-closed); volume-level db copy still works.
      zh-CN:
        name: 备份令牌
        description: 应用内「保存备份/从备份恢复」的共享密钥。在此填任意一串随机字符，并在 ID Plan 设置 →「NAS 服务」填入同一串值。留空 = 应用内备份被拒（安全设计）；卷级拷贝数据库文件不受影响。
  - key: IDPLAN_AGENT_API_TOKEN
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: Agent Ingress Token
        description: Shared secret for the four Agent endpoints (health / boards / import / tasks). Recommend a DIFFERENT value from the backup token (separation of duties). Enter the same value in the Agent panel (NAS mode) inside ID Plan. Empty = Agent endpoints refused (fail-closed).
      zh-CN:
        name: Agent 接入令牌
        description: Agent 四端点（health / boards / import / tasks）的共享密钥。建议与「备份令牌」填不同的值（职责分离）。在 ID Plan 的 Agent 接入面板（NAS 档）填入同一串值即通。留空 = Agent 端点被拒（安全设计）。
  - key: IDPLAN_NL_LLM_BASE_URL
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: NL Channel - LLM Endpoint
        description: Base URL of an OpenAI-compatible endpoint for the optional natural-language command channel (e.g. your own Ollama). All three NL_LLM_* values must be set or the channel stays refused (fail-closed). Leaving unset = natural language not enabled (safer default).
      zh-CN:
        name: 自然语言通道 - LLM 地址
        description: 可选的「自然语言调期」通道所用的 OpenAI 兼容端点（可填你自己的 Ollama）。三个 NL_LLM_* 必须全部填写，否则该通道保持拒绝（fail-closed）。留空 = 不启用自然语言（更安全的默认）。
  - key: IDPLAN_NL_LLM_API_KEY
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: NL Channel - API Key
        description: API key for the LLM endpoint above. Self-hosted (your own Ollama) may accept any non-empty value. Never committed to the repo — you configure it here only.
      zh-CN:
        name: 自然语言通道 - API Key
        description: 上面 LLM 端点的密钥。自架（自己的 Ollama）可填任意非空值。绝不入仓库——只在此处配置。
  - key: IDPLAN_NL_LLM_MODEL
    type: string
    required: false
    changeable: true
    i18n:
      en-US:
        name: NL Channel - Model
        description: Model name passed to the endpoint (e.g. qwen2.5:7b / deepseek-chat).
      zh-CN:
        name: 自然语言通道 - 模型名
        description: 传给端点的模型名（如 qwen2.5:7b / deepseek-chat）。

