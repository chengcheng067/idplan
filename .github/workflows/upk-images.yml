# =====================================================================
# ID Plan · 导出「绿联 UPK 专用」镜像 tar（经典 docker-save 格式）
#
# 为什么单独一个工作流？
#   绿联官方 Docker 应用（UPK）要求把镜像以 tar 形式放进
#   rootfs_<arch>/images/，随包一起安装，且必须是经典 docker save 格式
#   （tar 内含 manifest.json，Layers 形如 <hash>/layer.tar）。
#
# 为什么不能 pull + docker save？
#   GitHub Actions runner 的 Docker 启用了 containerd 镜像存储，
#   `docker save` 会输出 OCI layout（blobs/sha256/...），绿联 ugcli
#   校验会报 "manifest.json not found"；且 OCI layout 把镜像层展开成
#   未压缩 tar，后端体积从 ~166MB 膨胀到 ~562MB。
#
# 为什么不能 buildx --output type=oci？
#   同上，OCI 格式绿联不认。
#
# 正确做法：buildx 单架构构建 + `--output type=docker,dest=xxx.tar`
#   → 产出经典 docker-tar（含 manifest.json + 压缩 layer），tag 可控。
#
# tar 内部 tag 固定为：idplan:0.7.0 / idplan-backend:0.7.0
# 必须与 ugnas/upk/rootfs_common/docker-compose.yaml 的 image: 完全一致。
#
# 触发（两种都行）：
#   1. 推送 upk- 开头的 tag，例如：
#        git tag upk-0.7.0-1 && git push origin upk-0.7.0-1
#      版本号从 tag 名里解析（upk-<版本>-<序号> → <版本>）
#   2. 在 GitHub → Actions → upk-images → Run workflow 手动点
# =====================================================================
name: upk-images

on:
  push:
    tags:
      - "upk-*"
  workflow_dispatch:
    inputs:
      version:
        description: "镜像版本号（默认 0.7.0，需与 ghcr 上已存在的 tag 一致）"
        required: false
        default: "0.7.0"

env:
  OWNER: chengcheng067
  FRONT: idplan
  BACK: idplan-backend

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 确定版本号
        run: |
          VER="${{ github.event.inputs.version }}"
          # 从 tag 解析：upk-0.7.0-1 → 0.7.0
          if [ -z "$VER" ] && [[ "${GITHUB_REF}" == refs/tags/upk-* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            REST="${TAG#upk-}"
            VER="${REST%-*}"
          fi
          if [ -z "$VER" ]; then VER="0.7.0"; fi
          echo "VERSION=${VER}" >> "$GITHUB_ENV"
          echo "解析到版本号：${VER}（来源 ref=${GITHUB_REF}）"

      # ---------- amd64 ----------
      - name: 导出 amd64 tar（经典 docker-save 格式）
        run: |
          set -e
          mkdir -p upk-images
          docker buildx build --platform linux/amd64 \
            -f ugnas/Dockerfile -t ${{ env.FRONT }}:${{ env.VERSION }} \
            --output type=docker,dest=upk-images/${{ env.FRONT }}-amd64-upk.tar .
          docker buildx build --platform linux/amd64 \
            -f ugnas/Dockerfile.backend -t ${{ env.BACK }}:${{ env.VERSION }} \
            --output type=docker,dest=upk-images/${{ env.BACK }}-amd64-upk.tar .

      # ---------- arm64 ----------
      - name: 导出 arm64 tar（经典 docker-save 格式）
        run: |
          set -e
          docker buildx build --platform linux/arm64 \
            -f ugnas/Dockerfile -t ${{ env.FRONT }}:${{ env.VERSION }} \
            --output type=docker,dest=upk-images/${{ env.FRONT }}-arm64-upk.tar .
          docker buildx build --platform linux/arm64 \
            -f ugnas/Dockerfile.backend -t ${{ env.BACK }}:${{ env.VERSION }} \
            --output type=docker,dest=upk-images/${{ env.BACK }}-arm64-upk.tar .

      # ---------- 校验：必须是经典格式 + 单镜像单 tag ----------
      - name: 校验 tar 格式与 tag
        run: |
          set -e
          cd upk-images
          for f in *.tar; do
            echo "--- $f ---"
            # 经典 docker save 的标志：根下有 manifest.json 且顶层不是 blobs/
            tar -xf "$f" -O manifest.json > /tmp/m.json
            TAGS=$(node -e '
              const j = JSON.parse(require("fs").readFileSync("/tmp/m.json","utf8"));
              if (!Array.isArray(j) || j.length !== 1) {
                console.error("FAIL: manifest 数量 = " + j.length + "（必须恰好 1）");
                process.exit(1);
              }
              console.log(j[0].RepoTags.join(","));
            ')
            echo "  RepoTags = ${TAGS}"
            if echo "$TAGS" | grep -q "latest"; then
              echo "FAIL: 禁止 latest tag"; exit 1
            fi
          done
          echo ""
          echo "=== 产物清单 ==="
          ls -lh

      - name: 上传 tar 到 Release
        uses: softprops/action-gh-release@v2
        with:
          name: "ID Plan UPK Images ${{ env.VERSION }}"
          tag_name: "upk-images-${{ env.VERSION }}"
          files: upk-images/*.tar
          fail_on_unmatched_files: true
